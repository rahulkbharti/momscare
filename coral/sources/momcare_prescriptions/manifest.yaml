name: momcare_prescriptions
version: 0.1.0
dsl_version: 3
backend: file
description: Prescription medicines extracted from real prescription images using Gemini Vision OCR
test_queries:
  - SELECT record_id, medicine_name, dosage, frequency FROM momcare_prescriptions.prescriptions LIMIT 3
  - SELECT COUNT(*) AS total_prescriptions FROM momcare_prescriptions.prescriptions
tables:
  - name: prescriptions
    format: jsonl
    description: Medicines and dosage schedule extracted from prescription documents
    source:
      location: "file:///D:/hackathons/mom5/mom-care/data/"
      glob: "prescriptions.jsonl"
    columns:
      - name: record_id
        type: Utf8
        description: MongoDB record ID (links to patients)
      - name: medicine_name
        type: Utf8
        description: Name of the medicine
      - name: dosage
        type: Utf8
        description: Dosage amount e.g. 40mg
      - name: frequency
        type: Int64
        description: Number of doses per day
      - name: timings
        type: Utf8
        description: Comma-separated timing slots e.g. 08:00,21:00
      - name: instructions
        type: Utf8
        description: Special instructions e.g. before breakfast
      - name: extracted_at
        type: Utf8
        description: Timestamp when document was processed
